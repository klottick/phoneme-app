name: linguist
description: Mobile app for phoneme-focused language learning.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  supabase_flutter: ^2.6.0
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.3.2
  audioplayers: ^6.1.0
  record: ^5.1.2
  flutter_tts: ^4.0.2
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  share_plus: ^10.0.0

  http: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - .env.example
    - assets/audio/fr/manifest.json
    - assets/audio/fr/provenance.json
    - assets/audio/fr/words/
    - assets/audio/fr/licenses/
